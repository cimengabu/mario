<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🟡 PACMAN GAME - Phaser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Arial', sans-serif;
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            color: #FFD700;
        }

        .game-info {
            margin-bottom: 20px;
            font-size: 1.1em;
            opacity: 0.9;
        }

        #game {
            background: #0a0e27;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            border: 3px solid #FFD700;
        }

        .controls {
            margin-top: 20px;
            font-size: 0.9em;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            line-height: 1.8;
        }

        .controls h3 {
            margin-bottom: 10px;
            font-size: 1.2em;
            color: #FFD700;
        }

        .info-text {
            color: #00ff00;
            margin-top: 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🟡 PACMAN 👻</h1>
        <div class="game-info">
            <p>Makan semua pellet! Hindari ghost! 👻👻👻</p>
        </div>
        <div id="game"></div>
        <div class="controls">
            <h3>🎮 Kontrol Permainan:</h3>
            <div>
                <p>⬅️ ➡️ ⬆️ ⬇️ atau WASD - Bergerak</p>
                <p>Makan 🟡 pellet untuk +10 poin</p>
                <p>Makan 🔴 power-up untuk +50 poin (ghost kotak!)</p>
                <p>Hindari 👻 ghost - game over!</p>
            </div>
            <div class="info-text">
                ⭐ Level: lebih banyak ghost & lebih cepat!
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <script src="js/pacman-game.js"></script>
</body>
</html>
